<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1D1912" />
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D9701C" />
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#948A79" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="760" fill="#FAF7F3" />

  <text x="40" y="46" font-size="24" font-weight="700" fill="#1D1912">Monish's ElevateBox voice agent — full system, end to end</text>
  <text x="40" y="70" font-size="13" fill="#6B6459">Our backend triggers and owns everything — campaigns, retries, recordings, transcripts, WhatsApp — through Sarvam's Voice Agent + Instant Outbound API</text>

  <!-- ===== Column 1: Our Backend mega box ===== -->
  <rect x="40" y="108" width="380" height="470" rx="8" fill="none" stroke="#1D1912" stroke-width="1.4" stroke-dasharray="6 4" />
  <text x="60" y="132" font-size="13" font-weight="700" fill="#1D1912">OUR BACKEND · apps/voice-server</text>

  <!-- Console -->
  <rect x="62" y="148" width="336" height="64" rx="4" fill="#FFF" stroke="#948A79" stroke-width="1.2" />
  <text x="230" y="170" text-anchor="middle" font-size="13" font-weight="700" fill="#1D1912">🔒 Console (password-protected)</text>
  <text x="230" y="188" text-anchor="middle" font-size="10.5" fill="#6B6459">grouped calls · transcripts · recording playback</text>
  <text x="230" y="202" text-anchor="middle" font-size="10.5" fill="#6B6459">campaign + retry controls</text>

  <!-- Campaign dispatcher -->
  <rect x="62" y="228" width="336" height="92" rx="4" fill="#FFF" stroke="#948A79" stroke-width="1.2" />
  <text x="230" y="250" text-anchor="middle" font-size="13" font-weight="700" fill="#1D1912">Campaign dispatcher</text>
  <text x="230" y="268" text-anchor="middle" font-size="10.5" fill="#6B6459">quick-dial or CSV upload</text>
  <text x="230" y="284" text-anchor="middle" font-size="10.5" fill="#6B6459">one call at a time, ~25s apart</text>
  <text x="230" y="300" text-anchor="middle" font-size="10.5" fill="#1D1912" font-weight="600">auto-retry: no-answer/busy/failed → requeued</text>
  <text x="230" y="314" text-anchor="middle" font-size="10" fill="#6B6459">up to N attempts, cooldown between tries</text>

  <!-- WhatsApp sender -->
  <rect x="62" y="336" width="336" height="76" rx="4" fill="#FFF" stroke="#948A79" stroke-width="1.2" />
  <text x="230" y="358" text-anchor="middle" font-size="13" font-weight="700" fill="#1D1912">WhatsApp sender (Baileys)</text>
  <text x="230" y="376" text-anchor="middle" font-size="10.5" fill="#6B6459">mid-call: hot-lead ping, fired live</text>
  <text x="230" y="392" text-anchor="middle" font-size="10.5" fill="#6B6459">post-call: context + Monish's number</text>
  <text x="230" y="406" text-anchor="middle" font-size="10.5" fill="#6B6459">+ resume + architecture diagram</text>

  <!-- Event log -->
  <rect x="62" y="428" width="336" height="66" rx="4" fill="#FFF" stroke="#948A79" stroke-width="1.2" />
  <text x="230" y="450" text-anchor="middle" font-size="13" font-weight="700" fill="#1D1912">Event log (in-memory)</text>
  <text x="230" y="467" text-anchor="middle" font-size="10" fill="#6B6459">receives: tool webhooks (mid-call) +</text>
  <text x="230" y="481" text-anchor="middle" font-size="10" fill="#6B6459">call-completion webhook (status, transcript, variables)</text>

  <!-- ===== Column 2: Sarvam Voice Agent ===== -->
  <rect x="480" y="150" width="340" height="270" rx="6" fill="#FFF" stroke="#D9701C" stroke-width="2.2" />
  <text x="650" y="178" text-anchor="middle" font-size="16" font-weight="700" fill="#D9701C">Sarvam Voice Agent</text>
  <text x="650" y="196" text-anchor="middle" font-size="10.5" fill="#6B6459">runs the entire live conversation</text>

  <rect x="502" y="212" width="94" height="46" rx="3" fill="#FAF7F3" stroke="#948A79" stroke-width="1" />
  <text x="549" y="232" text-anchor="middle" font-size="11" fill="#1D1912">Speech</text>
  <text x="549" y="246" text-anchor="middle" font-size="11" fill="#1D1912">to text</text>

  <rect x="604" y="212" width="94" height="46" rx="3" fill="#FAF7F3" stroke="#948A79" stroke-width="1" />
  <text x="651" y="232" text-anchor="middle" font-size="11" fill="#1D1912">Reasoning</text>
  <text x="651" y="246" text-anchor="middle" font-size="10" fill="#6B6459">(LLM + prompt)</text>

  <rect x="706" y="212" width="94" height="46" rx="3" fill="#FAF7F3" stroke="#948A79" stroke-width="1" />
  <text x="753" y="232" text-anchor="middle" font-size="11" fill="#1D1912">Text to</text>
  <text x="753" y="246" text-anchor="middle" font-size="11" fill="#1D1912">speech</text>

  <text x="650" y="284" text-anchor="middle" font-size="11" fill="#1D1912" font-weight="600">Tools, called mid-call:</text>
  <text x="650" y="300" text-anchor="middle" font-size="10.5" fill="#6B6459">classify_lead · note_discovery · request_callback</text>

  <line x1="510" y1="320" x2="790" y2="320" stroke="#E4D9C8" stroke-width="1" />
  <text x="650" y="342" text-anchor="middle" font-size="10.5" fill="#1D1912" font-weight="600">Dials out from a Sarvam-rented number</text>
  <text x="650" y="358" text-anchor="middle" font-size="10" fill="#6B6459">+91 80715 79499 · Telugu-first, Hindi/English switch</text>
  <text x="650" y="374" text-anchor="middle" font-size="10" fill="#6B6459">bilingual TTS · barge-in · pronunciation-tuned</text>
  <text x="650" y="396" text-anchor="middle" font-size="9.5" fill="#948A79">was: Exotel telephony → now: number rented directly through Sarvam</text>

  <!-- Sarvam Analytics API -->
  <rect x="480" y="450" width="340" height="66" rx="4" fill="#F1ECE4" stroke="#948A79" stroke-width="1.2" />
  <text x="650" y="474" text-anchor="middle" font-size="13" font-weight="700" fill="#1D1912">Sarvam Analytics API</text>
  <text x="650" y="492" text-anchor="middle" font-size="10.5" fill="#6B6459">recordings + transcripts, by interaction_id</text>
  <text x="650" y="506" text-anchor="middle" font-size="10.5" fill="#6B6459">pulled on demand when Console plays audio</text>

  <!-- ===== Column 3: Lead's phone ===== -->
  <rect x="900" y="180" width="200" height="150" rx="4" fill="none" stroke="#1D1912" stroke-width="1.6" />
  <text x="1000" y="216" text-anchor="middle" font-size="15" font-weight="700" fill="#1D1912">Lead's phone</text>
  <text x="1000" y="236" text-anchor="middle" font-size="10.5" fill="#6B6459">+91, India</text>
  <text x="1000" y="266" text-anchor="middle" font-size="10.5" fill="#1D1912">receives the call</text>
  <text x="1000" y="284" text-anchor="middle" font-size="10.5" fill="#1D1912">receives WhatsApp:</text>
  <text x="1000" y="300" text-anchor="middle" font-size="10" fill="#6B6459">hot-lead ping (live)</text>
  <text x="1000" y="314" text-anchor="middle" font-size="10" fill="#6B6459">full follow-up (post-call)</text>

  <!-- ===== Arrows — four lanes through the gap, each at its own height ===== -->

  <!-- Lane 1 (top): Backend -> Sarvam: Instant Outbound trigger -->
  <path d="M398,265 C440,265 440,220 480,215" fill="none" stroke="#D9701C" stroke-width="2" marker-end="url(#arrowAccent)" />
  <text x="452" y="176" text-anchor="middle" font-size="10.5" fill="#D9701C" font-weight="600">Instant Outbound API</text>
  <text x="452" y="190" text-anchor="middle" font-size="9" fill="#D9701C">POST /outbounds</text>
  <text x="452" y="202" text-anchor="middle" font-size="9" fill="#D9701C">caller_number set explicitly</text>

  <!-- Sarvam -> Lead's phone: PSTN -->
  <line x1="820" y1="240" x2="896" y2="240" stroke="#1D1912" stroke-width="1.6" marker-end="url(#arrow)" />
  <text x="858" y="228" text-anchor="middle" font-size="10" fill="#6B6459">PSTN call</text>

  <!-- Lane 2: Sarvam -> Backend: tool webhooks (mid-call) -->
  <path d="M480,300 C455,300 430,296 400,285" fill="none" stroke="#1D1912" stroke-width="1.4" marker-end="url(#arrow)" />
  <text x="452" y="316" text-anchor="middle" font-size="9.5" fill="#1D1912" font-weight="600">tool webhooks</text>
  <text x="452" y="328" text-anchor="middle" font-size="9" fill="#6B6459">fired mid-call</text>

  <!-- Lane 3: Sarvam -> Backend: call-completion webhook (into Event log, no label needed — described in the box) -->
  <path d="M480,405 C450,420 420,440 400,455" fill="none" stroke="#1D1912" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#arrow)" />
  <text x="452" y="400" text-anchor="middle" font-size="8.5" fill="#948A79">fires from Sarvam's</text>
  <text x="452" y="411" text-anchor="middle" font-size="8.5" fill="#948A79">call infra directly</text>

  <!-- Lane 4: Backend -> Sarvam Analytics: recording lookup, short and direct -->
  <path d="M398,483 C430,483 450,483 476,483" fill="none" stroke="#948A79" stroke-width="1.3" stroke-dasharray="3 3" marker-end="url(#arrowMuted)" />
  <text x="452" y="500" text-anchor="middle" font-size="8.5" fill="#6B6459">recording lookup</text>

  <!-- WhatsApp sender -> Lead's phone -->
  <path d="M398,374 C650,440 820,380 896,300" fill="none" stroke="#D9701C" stroke-width="1.8" marker-end="url(#arrowAccent)" />

  <!-- Retry loop: Event log -> Campaign dispatcher -->
  <path d="M62,460 C10,460 10,270 62,270" fill="none" stroke="#1D1912" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrow)" />
  <text x="26" y="365" text-anchor="middle" font-size="8.5" fill="#6B6459" transform="rotate(-90 26 365)">no_answer / busy / failed → requeue</text>

  <!-- ===== Footnote ===== -->
  <rect x="40" y="596" width="1160" height="58" rx="6" fill="#F1ECE4" stroke="#D9D0C2" stroke-width="1" />
  <text x="60" y="620" font-size="11.5" fill="#1D1912" font-weight="600">Telephony history: started on Exotel (India-domestic PSTN, no cross-border KYC) as the initial setup.</text>
  <text x="60" y="638" font-size="11" fill="#6B6459">Switched to a number rented directly through Sarvam plus its own Instant Outbound API — one integration instead of two, and it fixed a real call-drop bug Exotel's bridging mode caused.</text>

  <text x="40" y="700" font-size="11" fill="#948A79">M. Monish Vijay · +91 7330671778 · built for the ElevateBox SDE Intern assignment</text>
</svg>
