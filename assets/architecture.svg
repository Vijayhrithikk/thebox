<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1D1912" />
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D9701C" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="640" fill="#FAF7F3" />

  <text x="40" y="46" font-size="24" font-weight="700" fill="#1D1912">Monish's ElevateBox voice agent — call to action, end to end</text>
  <text x="40" y="70" font-size="13" fill="#6B6459">Exotel (telephony) · Sarvam Voice Agent (STT+LLM+TTS+tools) · own backend (WhatsApp+scheduler+monitoring)</text>

  <!-- Caller -->
  <rect x="40" y="220" width="140" height="80" rx="4" fill="none" stroke="#1D1912" stroke-width="1.6" />
  <text x="110" y="256" text-anchor="middle" font-size="15" font-weight="700" fill="#1D1912">Caller's</text>
  <text x="110" y="276" text-anchor="middle" font-size="15" font-weight="700" fill="#1D1912">phone</text>
  <text x="110" y="294" text-anchor="middle" font-size="11" fill="#6B6459">+91, India</text>

  <line x1="180" y1="248" x2="252" y2="248" stroke="#1D1912" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="252" y1="280" x2="180" y2="280" stroke="#1D1912" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="216" y="238" text-anchor="middle" font-size="11" fill="#6B6459">PSTN call</text>

  <!-- Exotel -->
  <rect x="252" y="204" width="150" height="112" rx="4" fill="#F1ECE4" stroke="#1D1912" stroke-width="1.6" />
  <text x="327" y="240" text-anchor="middle" font-size="15" font-weight="700" fill="#1D1912">Exotel</text>
  <text x="327" y="260" text-anchor="middle" font-size="11" fill="#6B6459">Indian domestic</text>
  <text x="327" y="276" text-anchor="middle" font-size="11" fill="#6B6459">telephony provider</text>
  <text x="327" y="298" text-anchor="middle" font-size="10" fill="#948A79">no cross-border KYC</text>

  <line x1="402" y1="238" x2="470" y2="238" stroke="#1D1912" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="470" y1="282" x2="402" y2="282" stroke="#1D1912" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="436" y="228" text-anchor="middle" font-size="10" fill="#6B6459">AgentStream</text>

  <!-- Sarvam agent box -->
  <rect x="470" y="150" width="330" height="240" rx="6" fill="#FFF" stroke="#D9701C" stroke-width="2.2" />
  <text x="635" y="180" text-anchor="middle" font-size="16" font-weight="700" fill="#D9701C">Sarvam Voice Agent</text>
  <text x="635" y="200" text-anchor="middle" font-size="11" fill="#6B6459">runs the entire live conversation</text>

  <rect x="494" y="216" width="88" height="46" rx="3" fill="#FAF7F3" stroke="#948A79" stroke-width="1" />
  <text x="538" y="244" text-anchor="middle" font-size="11" fill="#1D1912">Speech</text>
  <text x="538" y="257" text-anchor="middle" font-size="11" fill="#1D1912">to text</text>

  <rect x="592" y="216" width="88" height="46" rx="3" fill="#FAF7F3" stroke="#948A79" stroke-width="1" />
  <text x="636" y="240" text-anchor="middle" font-size="11" fill="#1D1912">Reasoning</text>
  <text x="636" y="253" text-anchor="middle" font-size="10" fill="#6B6459">(LLM + prompt)</text>

  <rect x="690" y="216" width="88" height="46" rx="3" fill="#FAF7F3" stroke="#948A79" stroke-width="1" />
  <text x="734" y="244" text-anchor="middle" font-size="11" fill="#1D1912">Text to</text>
  <text x="734" y="257" text-anchor="middle" font-size="11" fill="#1D1912">speech</text>

  <text x="635" y="292" text-anchor="middle" font-size="11" fill="#1D1912" font-weight="600">Tools, called mid-call:</text>
  <text x="635" y="310" text-anchor="middle" font-size="10.5" fill="#6B6459">classify_lead · note_discovery</text>
  <text x="635" y="326" text-anchor="middle" font-size="10.5" fill="#6B6459">request_callback · call ended</text>

  <!-- Sarvam -> our backend -->
  <line x1="800" y1="290" x2="866" y2="290" stroke="#D9701C" stroke-width="1.8" marker-end="url(#arrowAccent)" />
  <text x="833" y="278" text-anchor="middle" font-size="10" fill="#D9701C">webhook per tool call</text>

  <!-- Our backend -->
  <rect x="866" y="150" width="290" height="240" rx="6" fill="#F1ECE4" stroke="#1D1912" stroke-width="1.6" />
  <text x="1011" y="178" text-anchor="middle" font-size="15" font-weight="700" fill="#1D1912">Our backend</text>
  <text x="1011" y="196" text-anchor="middle" font-size="10.5" fill="#6B6459">the only code we still run</text>

  <rect x="886" y="214" width="120" height="42" rx="3" fill="#FFF" stroke="#948A79" />
  <text x="946" y="240" text-anchor="middle" font-size="11" fill="#1D1912">WhatsApp</text>

  <rect x="1016" y="214" width="120" height="42" rx="3" fill="#FFF" stroke="#948A79" />
  <text x="1076" y="234" text-anchor="middle" font-size="10.5" fill="#1D1912">Callback</text>
  <text x="1076" y="248" text-anchor="middle" font-size="10.5" fill="#1D1912">scheduler</text>

  <rect x="886" y="266" width="250" height="42" rx="3" fill="#FFF" stroke="#948A79" />
  <text x="1011" y="292" text-anchor="middle" font-size="11" fill="#1D1912">Event log (in-memory)</text>

  <text x="1011" y="330" text-anchor="middle" font-size="10" fill="#6B6459">mid-call: hot-lead WhatsApp fires here</text>
  <text x="1011" y="346" text-anchor="middle" font-size="10" fill="#6B6459">call end: full follow-up composed + sent</text>
  <text x="1011" y="362" text-anchor="middle" font-size="10" fill="#6B6459">(context, number, architecture image, resume)</text>

  <!-- backend loop back to callback scheduler re-dialing via exotel -->
  <path d="M1076,214 C1076,120 500,90 260,150 C240,158 236,180 252,204" fill="none" stroke="#1D1912" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrow)" />
  <text x="660" y="108" text-anchor="middle" font-size="10" fill="#6B6459">scheduled callback re-dials through the same Exotel/Sarvam flow</text>

  <!-- Console -->
  <rect x="940" y="450" width="180" height="80" rx="4" fill="none" stroke="#1D1912" stroke-width="1.6" />
  <text x="1030" y="482" text-anchor="middle" font-size="14" font-weight="700" fill="#1D1912">Console</text>
  <text x="1030" y="500" text-anchor="middle" font-size="10.5" fill="#6B6459">live monitoring UI</text>
  <text x="1030" y="516" text-anchor="middle" font-size="10" fill="#948A79">polls /events</text>

  <line x1="1011" y1="308" x2="1011" y2="440" stroke="#1D1912" stroke-width="1.3" marker-end="url(#arrow)" />

  <!-- Whatsapp/lead -->
  <rect x="480" y="450" width="180" height="80" rx="4" fill="#FFF" stroke="#D9701C" stroke-width="1.8" />
  <text x="570" y="482" text-anchor="middle" font-size="14" font-weight="700" fill="#D9701C">The lead's phone</text>
  <text x="570" y="500" text-anchor="middle" font-size="10.5" fill="#6B6459">receives WhatsApp</text>
  <text x="570" y="516" text-anchor="middle" font-size="10" fill="#948A79">mid-call ping + full follow-up</text>

  <path d="M946,256 C946,400 700,420 590,450" fill="none" stroke="#D9701C" stroke-width="1.6" marker-end="url(#arrowAccent)" />

  <text x="40" y="600" font-size="11" fill="#948A79">M. Monish Vijay · +91 7330671778 · built for the ElevateBox SDE Intern assignment</text>
</svg>
