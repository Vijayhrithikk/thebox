name: Deploy voice-server to EC2

on:
  push:
    branches: [main]
    paths:
      - "apps/voice-server/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd "${{ secrets.EC2_REPO_PATH }}"
            git pull --ff-only
            docker build -t elevatebox-voice -f apps/voice-server/Dockerfile .
            docker stop elevatebox-voice || true
            docker rm elevatebox-voice || true
            docker run -d --name elevatebox-voice --restart unless-stopped \
              --env-file .env -p 8080:8080 \
              -v /home/ubuntu/app/.baileys-auth-data:/app/apps/voice-server/.baileys-auth \
              elevatebox-voice
            docker image prune -f
